name: Go quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: go-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Go quality gates
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Show Go toolchain
        run: go version

      - name: Run shared quality gates
        run: bash scripts/check-go-quality-gates.sh

      - name: Verify universal macOS release artifact
        run: bash scripts/build-macos-release.sh dist/scale2sheet-universal
